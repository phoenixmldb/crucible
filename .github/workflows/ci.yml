name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Determine version
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="1.1.${COMMIT_COUNT}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Restore
        run: dotnet restore Crucible.slnx

      - name: Build
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build Crucible.slnx -c Release --no-restore -p:Version="$BUILD_VERSION"

      - name: Test
        run: dotnet test Crucible.slnx -c Release --no-restore --no-build --verbosity normal

      # Packs on pull requests too, so package-smoke can gate a PR rather than
      # only reporting after the release is already public.
      - name: Pack
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Crucible.Core must be packed and published too: Crucible.Extensions
          # carries a ProjectReference to it, which becomes a hard NuGet
          # dependency in its nuspec. Publishing Extensions without Core left
          # every released version of crucible.extensions unrestorable
          # (NU1101: Unable to find package Crucible.Core).
          dotnet pack src/Crucible.Core -c Release --no-build \
            -p:PackageVersion="$PKG_VERSION" -o ./artifacts
          dotnet pack src/Crucible.Cli -c Release --no-build \
            -p:PackageVersion="$PKG_VERSION" -o ./artifacts
          dotnet pack src/Crucible.Extensions -c Release --no-build \
            -p:PackageVersion="$PKG_VERSION" -o ./artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

  # Consumes the packages exactly as a user would, from a local feed. The test
  # suite runs on ProjectReferences, so it cannot see packaging faults: every
  # published crucible.extensions from 1.0.0 to 1.1.47 failed to restore with
  # NU1101 while CI stayed green.
  package-smoke:
    needs: build
    runs-on: ubuntu-latest
    env:
      PKG_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Feed pointing at the freshly packed output
        run: |
          # Absolute path on purpose: NuGet resolves a relative <add value> against
          # the directory holding nuget.config, not the working directory, so a
          # relative feed silently retargets whenever the file is copied.
          cat > nuget.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="${GITHUB_WORKSPACE}/artifacts" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          cat nuget.config

      - name: Library package restores and builds
        run: |
          dotnet new classlib -o consumer -f net10.0
          cp nuget.config consumer/
          cd consumer
          dotnet add package Crucible.Extensions --version "$PKG_VERSION"
          dotnet build -c Release

      - name: Tool installs and reports its own version
        run: |
          dotnet tool install crucible.cli --version "$PKG_VERSION" \
            --tool-path ./tool --add-source "${GITHUB_WORKSPACE}/artifacts"
          reported=$(./tool/crucible --version)
          echo "reported: $reported"
          case "$reported" in
            *"$PKG_VERSION"*) echo "version matches package" ;;
            *) echo "::error::--version reported '$reported', expected $PKG_VERSION"; exit 1 ;;
          esac

      - name: Tool builds a site with each built-in theme
        run: |
          mkdir site && cd site
          ../tool/crucible init
          for theme in default modern; do
            ../tool/crucible build -s ./docs -o "./out-$theme" -t "$theme" --title Smoke
            pages=$(find "./out-$theme" -name '*.html' | wc -l)
            assets=$(find "./out-$theme" \( -name '*.css' -o -name '*.js' \) | wc -l)
            echo "$theme: $pages page(s), $assets asset(s)"
            # Themes ship as package content; if that regresses the build either
            # fails outright or emits pages with no stylesheet.
            if [ "$pages" -lt 1 ] || [ "$assets" -lt 4 ]; then
              echo "::error::$theme theme produced $pages pages / $assets assets"
              exit 1
            fi
          done

  publish:
    needs: [build, package-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Push to NuGet
        env:
          NUGET_KEY: ${{ secrets.NUGET_API_KEY }}
          PKG_VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Dependency order, and it matters. Crucible.Extensions declares a hard
          # dependency on Crucible.Core, so publishing Extensions when Core did
          # not make it produces an unrestorable package — the NU1101 failure
          # this pipeline exists to prevent, in a version NuGet will not let you
          # delete. `set -e` aborts the moment any push fails, so a partial
          # publish can only ever be a prefix of this list.
          set -e
          for id in Crucible.Core crucible.cli Crucible.Extensions; do
            pkg="./artifacts/${id}.${PKG_VERSION}.nupkg"
            if [ ! -f "$pkg" ]; then
              echo "::error::expected package not found: $pkg"
              ls -1 ./artifacts
              exit 1
            fi
            echo "--- pushing $id $PKG_VERSION"
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
