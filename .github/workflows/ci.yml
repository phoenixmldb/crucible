name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Determine version
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="1.1.${COMMIT_COUNT}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Restore
        run: dotnet restore Crucible.slnx

      - name: Build
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build Crucible.slnx -c Release --no-restore -p:Version="$BUILD_VERSION"

      - name: Test
        run: dotnet test Crucible.slnx -c Release --no-restore --no-build --verbosity normal

      # Packs on pull requests too, so package-smoke can gate a PR rather than
      # only reporting after the release is already public.
      - name: Pack
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # crucible.cli is the only published package. Crucible.Core and
          # Crucible.Extensions are IsPackable=false — they ship inside the tool,
          # which PackAsTool builds from the full publish output.
          dotnet pack src/Crucible.Cli -c Release --no-build \
            -p:PackageVersion="$PKG_VERSION" -o ./artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

  # Installs the packed tool exactly as a user would, from a local feed. The test
  # suite runs on ProjectReferences and never touches a .nupkg, so it cannot see
  # packaging faults — which is how crucible.extensions shipped unrestorable five
  # times (NU1101) while CI stayed green.
  package-smoke:
    needs: build
    runs-on: ubuntu-latest
    env:
      PKG_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Feed pointing at the freshly packed output
        run: |
          # Absolute path on purpose: NuGet resolves a relative <add value> against
          # the directory holding nuget.config, not the working directory, so a
          # relative feed silently retargets whenever the file is copied.
          cat > nuget.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="${GITHUB_WORKSPACE}/artifacts" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          cat nuget.config

      - name: Only the tool is published
        run: |
          # Guards the IsPackable=false settings on Crucible.Core and
          # Crucible.Extensions. Publishing either as a library means committing
          # to a public API surface and, for Core, shipping Themes/ as package
          # content — a deliberate decision, not something to regress into.
          unexpected=$(find ./artifacts -name '*.nupkg' \
            ! -name "crucible.cli.${PKG_VERSION}.nupkg" -printf '%f\n')
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected package(s) packed: $unexpected"
            exit 1
          fi
          test -f "./artifacts/crucible.cli.${PKG_VERSION}.nupkg"
          echo "artifacts contain only crucible.cli ${PKG_VERSION}"

      - name: Tool installs and reports its own version
        run: |
          dotnet tool install crucible.cli --version "$PKG_VERSION" \
            --tool-path ./tool --add-source "${GITHUB_WORKSPACE}/artifacts"
          reported=$(./tool/crucible --version)
          echo "reported: $reported"
          case "$reported" in
            *"$PKG_VERSION"*) echo "version matches package" ;;
            *) echo "::error::--version reported '$reported', expected $PKG_VERSION"; exit 1 ;;
          esac

      - name: Tool builds a site with each built-in theme
        run: |
          mkdir site && cd site
          ../tool/crucible init
          for theme in default modern; do
            ../tool/crucible build -s ./docs -o "./out-$theme" -t "$theme" --title Smoke
            pages=$(find "./out-$theme" -name '*.html' | wc -l)
            assets=$(find "./out-$theme" \( -name '*.css' -o -name '*.js' \) | wc -l)
            echo "$theme: $pages page(s), $assets asset(s)"
            # Themes ship as package content; if that regresses the build either
            # fails outright or emits pages with no stylesheet.
            if [ "$pages" -lt 1 ] || [ "$assets" -lt 4 ]; then
              echo "::error::$theme theme produced $pages pages / $assets assets"
              exit 1
            fi
          done

  # Publishes with NuGet trusted publishing: the job exchanges a GitHub OIDC
  # token for an API key that lives one hour, instead of a long-lived secret.
  # The previous long-lived key stopped working three months after the last
  # release with no warning, which is the failure mode this removes.
  #
  # Requires a trusted publishing policy on nuget.org matching:
  #   Repository Owner: phoenixmldb
  #   Repository:       crucible
  #   Workflow File:    ci.yml        <- this file's name; renaming it breaks the policy
  #   Environment:      (empty)      <- this job uses no GitHub environment
  publish:
    needs: [build, package-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for the OIDC token exchange
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Check the nuget.org user is configured
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          # Not a secret — it is the public nuget.org profile name, and keeping it
          # a repo variable means correcting it does not need a commit.
          if [ -z "$NUGET_USER" ]; then
            echo "::error::repository variable NUGET_USER is not set. It must be the"
            echo "::error::nuget.org profile name the trusted publishing policy belongs"
            echo "::error::to (a username, not an email address)."
            exit 1
          fi
          echo "nuget.org user: $NUGET_USER"

      # Exchanges the OIDC token for a temporary key. Keys are valid for one hour
      # and single-use, so this runs immediately before the push.
      - name: NuGet login (OIDC to short-lived API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PKG_VERSION: ${{ needs.build.outputs.version }}
        run: |
          # One package, named explicitly rather than globbed: a glob would
          # silently publish anything that appeared in ./artifacts, and the
          # libraries are deliberately not published.
          set -e
          pkg="./artifacts/crucible.cli.${PKG_VERSION}.nupkg"
          if [ ! -f "$pkg" ]; then
            echo "::error::expected package not found: $pkg"
            ls -1 ./artifacts
            exit 1
          fi
          dotnet nuget push "$pkg" \
            --api-key "$NUGET_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
